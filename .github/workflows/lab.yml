name: Lab verify (real MLflow)

on:
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - '.github/workflows/lab.yml'
  pull_request:
    paths:
      - 'lab/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: lab/requirements.txt
      - name: Install lab deps
        run: pip install -r requirements.txt
      - name: Verify curriculum against real MLflow
        run: python verify_curriculum.py
      - name: Models smoke
        run: python serve_smoke.py
      - name: Scenario suite
        run: python suite_scenarios.py
